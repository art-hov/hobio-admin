# Included inside Elastic Beanstalk's nginx server block.
# The load balancer adds X-Forwarded-Proto: "http" for requests that came in on port 80,
# "https" for port 443. Send plain-HTTP visitors to the HTTPS address.
# Requests with no such header (the load balancer's own health checks) are left alone.
if ($http_x_forwarded_proto = "http") {
    return 301 https://$host$request_uri;
}
