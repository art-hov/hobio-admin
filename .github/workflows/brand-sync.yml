name: Brand sync (fetch logo and colors from hobio.ca)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download logo, homepage and stylesheets
        run: |
          set -euo pipefail
          mkdir -p brand
          curl -fsSL https://hobio.ca/ -o brand/homepage.html
          curl -fsSL https://hobio.ca/logo.svg -o brand/logo.svg
          # Download every stylesheet linked from the homepage
          grep -oE 'href="[^"]+\.css[^"]*"' brand/homepage.html | sed -E 's/href="([^"]+)"/\1/' | sort -u > brand/css-links.txt || true
          i=0
          while read -r href; do
            case "$href" in
              http*) url="$href" ;;
              /*) url="https://hobio.ca$href" ;;
              *) url="https://hobio.ca/$href" ;;
            esac
            i=$((i+1))
            curl -fsSL "$url" -o "brand/style-$i.css" || echo "failed: $url"
          done < brand/css-links.txt
          # Inline <style> blocks, if any
          sed -n '/<style/,/<\/style>/p' brand/homepage.html > brand/inline-styles.css || true
          ls -la brand

      - name: Commit brand files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add brand
          git commit -m "Sync brand assets from hobio.ca" || echo "No changes"
          git push
